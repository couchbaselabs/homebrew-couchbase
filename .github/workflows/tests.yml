name: Brew Test & Build Bottles

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test-bot:
    strategy:
      matrix:
        os: [macos-15, macos-26, xcode-27]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Cache Homebrew Bundler RubyGems
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - name: Install Homebrew Bundler RubyGems
        if: steps.cache.outputs.cache-hit != 'true'
        run: brew install-bundler-gems

      - name: Run brew test-bot (--only-cleanup-before)
        run: brew test-bot --only-cleanup-before

      - name: Run brew test-bot (--only-setup)
        run: brew test-bot --only-setup

      - name: Run brew test-bot (--only-tap-syntax)
        run: brew test-bot --only-tap-syntax

      - name: Run brew test-bot (--only-formulae)
        run: |
          brew test-bot --only-formulae --root-url=https://ghcr.io/v2/couchbaselabs/couchbase couchbase-cxx-client
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload bottles as artifact
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
